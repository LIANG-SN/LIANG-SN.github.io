<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc"><title id="title">The LLM Stack: Research and Infrastructure</title><desc id="desc">Seven lifecycle stages with research decisions and infrastructure responsibilities. Evaluation, safety, and model-system co-design span the lifecycle. Production feedback informs data and training.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8cae"/></marker></defs><rect width="1200" height="1230" rx="22" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="42" y="56" font-size="16" letter-spacing="2" font-weight="700" fill="#2563eb">A GENERAL-PURPOSE LLM LIFECYCLE</text><text x="42" y="100" font-size="35" font-weight="750" fill="#12243b">Research × Infrastructure</text><text x="42" y="132" font-size="18" fill="#53657d">Connected responsibilities, from the first dataset to production feedback.</text><text x="62" y="184" font-size="15" font-weight="700" fill="#53657d">STAGE / OUTCOME</text><text x="355" y="184" font-size="15" font-weight="700" fill="#2563eb">RESEARCH &amp; MODELING</text><text x="752" y="184" font-size="15" font-weight="700" fill="#087f74">INFRASTRUCTURE &amp; ENGINEERING</text><rect x="42" y="203" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 219 V 293" stroke="#dce5f0"/><rect x="345" y="215" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="215" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="230" font-size="13" fill="#64748b">01</text><text x="60" y="257" font-size="19" font-weight="700" fill="#12243b">DATA</text><text x="60" y="283" font-size="15" fill="#53657d">Curate the learning signal</text><text x="360" y="246" font-size="16" fill="#12243b">Mixtures, quality, synthetic data</text><text x="360" y="274" font-size="14" fill="#53657d">Data scientist · data researcher</text><text x="755" y="246" font-size="16" fill="#12243b">Ingest, deduplicate, version</text><text x="755" y="274" font-size="14" fill="#53657d">Data engineer · human-data ops</text><path d="M 175 311 V 323" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="325" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 341 V 415" stroke="#dce5f0"/><rect x="345" y="337" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="337" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="352" font-size="13" fill="#64748b">02</text><text x="60" y="379" font-size="19" font-weight="700" fill="#12243b">PRETRAINING</text><text x="60" y="405" font-size="15" fill="#53657d">Build general capabilities</text><text x="360" y="368" font-size="16" fill="#12243b">Architecture, objectives, scaling</text><text x="360" y="396" font-size="14" fill="#53657d">Research scientist · research engineer</text><text x="755" y="368" font-size="16" fill="#12243b">Parallelism, kernels, recovery</text><text x="755" y="396" font-size="14" fill="#53657d">Training systems · GPU engineer</text><path d="M 175 433 V 445" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="447" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 463 V 537" stroke="#dce5f0"/><rect x="345" y="459" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="459" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="474" font-size="13" fill="#64748b">03</text><text x="60" y="501" font-size="19" font-weight="700" fill="#12243b">POST-TRAINING</text><text x="60" y="527" font-size="15" fill="#53657d">Shape behavior &amp; reasoning</text><text x="360" y="490" font-size="16" fill="#12243b">SFT, preferences, RL, rewards</text><text x="360" y="518" font-size="14" fill="#53657d">Post-training scientist · applied scientist</text><text x="755" y="490" font-size="16" fill="#12243b">Rollouts, environments, policy updates</text><text x="755" y="518" font-size="14" fill="#53657d">RL systems · research engineer</text><path d="M 175 555 V 567" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="569" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 585 V 659" stroke="#dce5f0"/><rect x="345" y="581" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="581" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="596" font-size="13" fill="#64748b">04</text><text x="60" y="623" font-size="19" font-weight="700" fill="#12243b">EVALUATION</text><text x="60" y="649" font-size="15" fill="#53657d">Measure what actually works</text><text x="360" y="612" font-size="16" fill="#12243b">Benchmarks, validity, safety</text><text x="360" y="640" font-size="14" fill="#53657d">Evaluation researcher · safety researcher</text><text x="755" y="612" font-size="16" fill="#12243b">Eval fleet, graders, regression checks</text><text x="755" y="640" font-size="14" fill="#53657d">Evaluation engineer · security engineer</text><path d="M 175 677 V 689" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="691" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 707 V 781" stroke="#dce5f0"/><rect x="345" y="703" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="703" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="718" font-size="13" fill="#64748b">05</text><text x="60" y="745" font-size="19" font-weight="700" fill="#12243b">INFERENCE / SERVING</text><text x="60" y="771" font-size="15" fill="#53657d">Execute efficiently</text><text x="360" y="734" font-size="16" fill="#12243b">Quantization, pruning, distillation</text><text x="360" y="762" font-size="14" fill="#53657d">Model optimization researcher</text><text x="755" y="734" font-size="16" fill="#12243b">Kernels, batching, KV cache, routing</text><text x="755" y="762" font-size="14" fill="#53657d">Inference engineer · serving engineer</text><path d="M 175 799 V 811" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="813" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 829 V 903" stroke="#dce5f0"/><rect x="345" y="825" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="825" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="840" font-size="13" fill="#64748b">06</text><text x="60" y="867" font-size="19" font-weight="700" fill="#12243b">DEPLOYMENT</text><text x="60" y="893" font-size="15" fill="#53657d">Deliver a useful product</text><text x="360" y="856" font-size="16" fill="#12243b">Task adaptation, RAG, agent design</text><text x="360" y="884" font-size="14" fill="#53657d">Applied scientist · ML engineer</text><text x="755" y="856" font-size="16" fill="#12243b">Releases, capacity, tools, edge runtime</text><text x="755" y="884" font-size="14" fill="#53657d">Platform engineer · SRE · edge engineer</text><path d="M 175 921 V 933" stroke="#6b8cae" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="935" width="1116" height="106" rx="14" fill="white" stroke="#dce5f0"/><path d="M 330 951 V 1025" stroke="#dce5f0"/><rect x="345" y="947" width="382" height="82" rx="10" fill="#eff5ff"/><rect x="740" y="947" width="402" height="82" rx="10" fill="#edf9f5"/><text x="60" y="962" font-size="13" fill="#64748b">07</text><text x="60" y="989" font-size="19" font-weight="700" fill="#12243b">MONITORING</text><text x="60" y="1015" font-size="15" fill="#53657d">Learn from real-world use</text><text x="360" y="978" font-size="16" fill="#12243b">Failure analysis, quality, drift</text><text x="360" y="1006" font-size="14" fill="#53657d">Applied scientist · evaluation researcher</text><text x="755" y="978" font-size="16" fill="#12243b">Traces, alerts, incidents, rollback</text><text x="755" y="1006" font-size="14" fill="#53657d">Observability engineer · SRE</text><path d="M 1168 995 H 1183 V 250 H 1166" fill="none" stroke="#6b8cae" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="42" y="1076" width="1116" height="64" rx="12" fill="#12243b"/><text x="62" y="1102" font-size="16" font-weight="700" fill="white">ACROSS EVERY STAGE</text><text x="62" y="1126" font-size="16" fill="#dce9ff">Evaluation &amp; safety · Reproducibility · Multimodal / speech · Model–system co-design</text><text x="42" y="1173" font-size="16" fill="#53657d">Feedback loops: production → data / evaluation / training; inference → RL rollouts.</text><text x="42" y="1202" font-size="14" fill="#64748b">Conceptual taxonomy · Roles overlap across teams · October 2026</text></g></svg>