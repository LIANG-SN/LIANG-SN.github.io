<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1310" role="img" aria-labelledby="title desc">
  <title id="title">The LLM lifecycle: work, outputs, and role families</title>
  <desc id="desc">Seven stages from data to production feedback. Each stage lists the work, output, and common owners without forcing a research and engineering split. Three role families span multiple stages.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7898bc"/></marker></defs>
  <rect width="1200" height="1310" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="58" font-size="15" letter-spacing="2" font-weight="700" fill="#2563eb">THE GENERAL-PURPOSE LLM STACK</text>
    <text x="48" y="103" font-size="34" font-weight="750" fill="#12243b">Work → output → ownership</text>
    <text x="48" y="136" font-size="18" fill="#53657d">Start with concrete responsibilities. Titles follow the work and often span stages.</text>
    <text x="66" y="188" font-size="13" font-weight="700" fill="#64748b">STAGE</text><text x="310" y="188" font-size="13" font-weight="700" fill="#64748b">CORE WORK</text><text x="744" y="188" font-size="13" font-weight="700" fill="#64748b">OUTPUT · COMMON OWNERS</text>
    <g>
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">01</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">DATA FOUNDATION</text><text x="66" y="290" font-size="14" fill="#53657d">Build the learning signal</text>
      <text x="310" y="249" font-size="16" fill="#12243b">Source · filter · deduplicate · tokenize</text><text x="310" y="276" font-size="14" fill="#53657d">Mix, annotate, validate, protect holdouts</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Versioned datasets</text><text x="750" y="274" font-size="14" fill="#53657d">Corpus/data engineers · data research · human data</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 116)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">02</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">PRETRAINING</text><text x="66" y="290" font-size="14" fill="#53657d">Learn general capabilities</text>
      <text x="310" y="249" font-size="16" fill="#12243b">Architecture · objective · optimization</text><text x="310" y="276" font-size="14" fill="#53657d">Distributed training, kernels, recovery</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Base checkpoint</text><text x="750" y="274" font-size="14" fill="#53657d">Model research · research engineering · training systems</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 232)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">03</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">POST-TRAINING</text><text x="66" y="290" font-size="14" fill="#53657d">Shape behavior &amp; reasoning</text>
      <text x="310" y="249" font-size="16" fill="#12243b">SFT · preference learning · RL</text><text x="310" y="276" font-size="14" fill="#53657d">Rewards, graders, environments, rollouts</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Behavior-shaped checkpoint</text><text x="750" y="274" font-size="14" fill="#53657d">Post-training/RL research · RE · RL systems</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 348)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">04</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">EVALUATION</text><text x="66" y="290" font-size="14" fill="#53657d">Decide whether it works</text>
      <text x="310" y="249" font-size="16" fill="#12243b">Capability · safety · robustness</text><text x="310" y="276" font-size="14" fill="#53657d">Regression, validity, release criteria</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Scorecard &amp; release decision</text><text x="750" y="274" font-size="14" fill="#53657d">Evaluation · safety · security · domain experts</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 464)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">05</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">INFERENCE / SERVING</text><text x="66" y="290" font-size="14" fill="#53657d">Execute efficiently</text>
      <text x="310" y="249" font-size="16" fill="#12243b">Kernels · quantization · batching</text><text x="310" y="276" font-size="14" fill="#53657d">KV cache, scheduling, routing, capacity</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Efficient endpoint</text><text x="750" y="274" font-size="14" fill="#53657d">Inference/performance · optimization · serving</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 580)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">06</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">PRODUCT / DEPLOYMENT</text><text x="66" y="290" font-size="14" fill="#53657d">Deliver a useful workflow</text>
      <text x="310" y="249" font-size="16" fill="#12243b">RAG · tools · agents · releases</text><text x="310" y="276" font-size="14" fill="#53657d">Capacity, permissions, edge/device integration</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Working user flow</text><text x="750" y="274" font-size="14" fill="#53657d">Applied ML · product/agent · platform · SRE · edge</text><path d="M170 308V320" stroke="#7898bc" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 696)">
      <rect x="48" y="204" width="1104" height="102" rx="14" fill="#fff" stroke="#dce5f0"/><rect x="292" y="216" width="428" height="78" rx="10" fill="#eef5ff"/><rect x="732" y="216" width="406" height="78" rx="10" fill="#edf9f5"/>
      <text x="66" y="238" font-size="12" fill="#2563eb">07</text><text x="66" y="267" font-size="19" font-weight="700" fill="#12243b">OBSERVABILITY</text><text x="66" y="290" font-size="14" fill="#53657d">Close the feedback loop</text>
      <text x="310" y="249" font-size="16" fill="#12243b">System health · behavior quality</text><text x="310" y="276" font-size="14" fill="#53657d">Incidents, drift, feedback curation</text>
      <text x="750" y="247" font-size="15" font-weight="700" fill="#12243b">Evidence &amp; improvement backlog</text><text x="750" y="274" font-size="14" fill="#53657d">Observability/SRE · evaluation · applied ML</text>
    </g>
    <path d="M1157 950H1175V254H1158" fill="none" stroke="#7898bc" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="1148" y="597" font-size="12" fill="#53657d" transform="rotate(-90 1148 597)">PRODUCTION FEEDBACK</text>
    <text x="48" y="1056" font-size="13" font-weight="700" letter-spacing="1.5" fill="#2563eb">ROLE FAMILIES SPAN STAGES</text>
    <rect x="48" y="1075" width="350" height="137" rx="14" fill="#eef5ff"/><text x="68" y="1106" font-size="17" font-weight="700" fill="#12243b">Model &amp; learning</text><text x="68" y="1134" font-size="14" fill="#53657d">Model research · research engineering</text><text x="68" y="1158" font-size="14" fill="#53657d">Post-training/RL · data &amp; feedback</text><text x="68" y="1182" font-size="14" fill="#53657d">Multimodal · interpretability</text>
    <rect x="425" y="1075" width="350" height="137" rx="14" fill="#edf9f5"/><text x="445" y="1106" font-size="17" font-weight="700" fill="#12243b">Measurement &amp; product</text><text x="445" y="1134" font-size="14" fill="#53657d">Evaluation · safety · AI security</text><text x="445" y="1158" font-size="14" fill="#53657d">Applied ML · retrieval · agents</text><text x="445" y="1182" font-size="14" fill="#53657d">Domain and product engineering</text>
    <rect x="802" y="1075" width="350" height="137" rx="14" fill="#f5f1fc"/><text x="822" y="1106" font-size="17" font-weight="700" fill="#12243b">Systems &amp; runtime</text><text x="822" y="1134" font-size="14" fill="#53657d">Training · RL infrastructure</text><text x="822" y="1158" font-size="14" fill="#53657d">Inference/performance · optimization</text><text x="822" y="1182" font-size="14" fill="#53657d">Platform/SRE · edge/device ML</text>
    <rect x="48" y="1233" width="1104" height="45" rx="11" fill="#12243b"/><text x="66" y="1261" font-size="15" fill="#e8f0fa">Evaluation, safety, reproducibility, and model–system co-design cut across the lifecycle.</text>
    <text x="48" y="1298" font-size="12" fill="#64748b">Conceptual taxonomy · Blank ownership is intentional · October 2026</text>
  </g>
</svg>
